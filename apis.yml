- aid: krakend:krakend-async-agent
  name: KrakenD Async Agent
  description: >-
    The KrakenD Async Agent enables event-driven API consumption by connecting KrakenD to message brokers
    and event queues such as AMQP, Kafka, and NATS. It allows KrakenD to consume messages from topics
    and queues and forward them to backend services without requiring an inbound HTTP request from a client.
  humanURL: https://www.krakend.io/docs/async/
  tags:
  - Async
  - Event-Driven
  - Kafka
  - Messaging
  properties:
